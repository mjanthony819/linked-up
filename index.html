<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.J.Anthony - Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        .social-link {
            width: 50px;
            height: 50px;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 24px;
            text-decoration: none;
            color: #ffffff;
        }
        .social-link:hover {
            border-color: #66d9ff;
            color: #66d9ff;
            transform: scale(1.1);
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            padding: 14px 20px;
            border: 1px solid #333;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        .link-btn:hover {
            border-color: #66d9ff;
            background: rgba(102, 217, 255, 0.1);
            color: #66d9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">◆</div>
        <h1>M.J.Anthony</h1>
        <p class="subtitle">i9yo Techie</p>
        
        <div class="social-links">
            <a href="https://instagram.com/mjanthon.y" class="social-link" title="Instagram">📷</a>
            <a href="mailto:mjanthony819@gmail.com" class="social-link" title="Email">✉️</a>
            <a href="https://discord.gg/yourprofile" class="social-link" title="Discord">🎮</a>
            <a href="https://linkedin.com/in/mjanthony" class="social-link" title="LinkedIn">💼</a>
            <a href="https://github.com/mjanthony819" class="social-link" title="GitHub">🐙</a>
            <a href="https://x.com/MjMjanthony819" class="social-link" title="Twitter">𝕏</a>
            <a href="https://www.youtube.com/@mjanthony2260" class="social-link" title="YouTube">▶️</a>
            <a href="#" class="social-link" title="Website">🦋</a>
        </div>
        
        <div class="links">
            <a href="#" class="link-btn">🔗 BIO LINK</a>
        </div>
    </div>
</body>
</html>
