<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.J.Anthony - Bio Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .logo {
            font-size: 72px;
            margin-bottom: 30px;
            background: conic-gradient(from 0deg, #ff0080, #ff8c00, #40e0d0, #0080ff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: spin 8s linear infinite;
        }
        
        @keyframes spin {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .subtitle {
            color: #999;
            font-size: 13px;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }
        
        .social-link {
            width: 55px;
            height: 55px;
            border: 2px solid #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 28px;
            text-decoration: none;
            color: #ffffff;
        }
        
        .social-link:hover {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .bio-link-btn {
            padding: 16px 40px;
            border: 1px solid #666;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .bio-link-btn:hover {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">◆</div>
        <h1>M.J.Anthony</h1>
        <p class="subtitle">i9yo Techie</p>
        
        <div class="social-links">
            <a href="https://instagram.com/mjanthon.y" class="social-link" title="Instagram">📷</a>
            <a href="mailto:mjanthony819@gmail.com" class="social-link" title="Email">✉️</a>
            <a href="https://discord.gg/" class="social-link" title="Discord">🎮</a>
            <a href="https://linkedin.com/in/mjanthony" class="social-link" title="LinkedIn">💼</a>
            <a href="https://github.com/mjanthony819" class="social-link" title="GitHub">🐙</a>
            <a href="https://x.com/MjMjanthony819" class="social-link" title="Twitter">𝕏</a>
            <a href="https://www.youtube.com/@mjanthony2260" class="social-link" title="YouTube">▶️</a>
            <a href="#" class="social-link" title="Website">🦋</a>
        </div>
        
        <a href="#" class="bio-link-btn">🔗 BIO LINK</a>
    </div>
</body>
</html>
